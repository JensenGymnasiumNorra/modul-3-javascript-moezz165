  <!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Miniräknare</title>
</head>
<body>
  <h2>Enkel Miniräknare</h2>

  <input type="number" id="tal1" placeholder="Första talet">
  <input type="number" id="tal2" placeholder="Andra talet">
  <br><br>

  <button id="plus">+</button>
  <button id="minus">-</button>
  <button id="gånger">*</button>
  <button id="delat">/</button>

  <h3>Resultat: <span id="resultat">0</span></h3>

  <script>
    const tal1 = document.getElementById("tal1");
    const tal2 = document.getElementById("tal2");
    const resultat = document.getElementById("resultat");

    document.getElementById("plus").onclick = function() {
      resultat.textContent = Number(tal1.value) + Number(tal2.value);
    }

    document.getElementById("minus").onclick = function() {
      resultat.textContent = Number(tal1.value) - Number(tal2.value);
    }

    document.getElementById("gånger").onclick = function() {
      resultat.textContent = Number(tal1.value) * Number(tal2.value);
    }

    document.getElementById("delat").onclick = function() {
      if (Number(tal2.value) === 0) {
        resultat.textContent = "Kan inte dela med 0!";
      } else {
        resultat.textContent = Number(tal1.value) / Number(tal2.value);
      }
    }
  </script>
</body>
</html>
