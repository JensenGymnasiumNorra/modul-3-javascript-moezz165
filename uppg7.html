<!--
    I denna fil har du fått en slider som du kan använda för att välja ett tal mellan 0 och 100.
    Din uppgift är att bygga ett "spel" där användaren ska gissa vilket tal som är valt.
    När användaren drar i slidern ska det stå om det valda talet är större eller mindre än det valda talet.
    När användaren har gissat rätt ska det stå att användaren har gissat rätt.
    All funktionalitet ska vara implementerad i filen uppg2.js.
    Extrauppgift 1: Lägg till en knapp som slumpar fram ett nytt tal.
    Extrauppgift 2: Lägg till kod i js så att det max-värdet på slidern ökar med 100 varje gång användaren gissat rätt.
                    Starta även om spelet när användaren har haft rätt och ha koll på hur många gånger den har haft rätt.
    Extrauppgift 3: Lägg till flera sliders som alla måste vara rätt för att användaren ska ha gissat rätt. 
                    Anpassa hinten på lämpligt sätt.
    
    
-->
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Temperaturkänsla</title>
</head>
<body>
  <h2>Temperaturkänsla</h2>

  <input type="range" id="tempSlider" min="-30" max="40" value="10">
  <p>Temperatur: <span id="tempVärde">10</span>°C</p>
  <h3 id="meddelande"></h3>

  <script>
    const slider = document.getElementById("tempSlider");
    const tempVärde = document.getElementById("tempVärde");
    const meddelande = document.getElementById("meddelande");

    slider.oninput = function() {
      const temp = Number(slider.value);
      tempVärde.textContent = temp;

      if (temp < -10) {
        meddelande.textContent = "för kallt, gå inte ens ut.";
      } else if (temp < 0) {
        meddelande.textContent = "Riktigt kallt ute, ta på varma kläder. ";
      } else if (temp < 10) {
        meddelande.textContent = "Lite kallt ta på en jacka.";
      } else if (temp < 20) {
        meddelande.textContent = "skönt väder";
      } else if (temp < 30) {
        meddelande.textContent = "för varmt gå sola.";
      } else {
        meddelande.textContent = "Sdet är extremt varmt, stanna inne och drick mycket vatten";
      }
    };
    slider.oninput();
  </script>
</body>
</html>
