<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Uppgift 4: Toggle Visibility</title>
  <style>
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; font-family: sans-serif; background: #eef; gap: 15px;
    }
    button {
      padding: 10px 20px; border: none; border-radius: 8px;
      background: #333; color: white; cursor: pointer;
    }
    button:hover { background: goldenrod; }
    #toggleElement {
      display: none;
      background: white; padding: 20px 30px; border-radius: 10px;
      box-shadow: 0 3px 10px black;
    }
  </style>
</head>
<body>
  <button onclick="toggleVisibility()">tryck inte</button>

  <div id="toggleElement">
    <h3>tryck inte sa jag, tryck igen</h3>
  </div>

  <script>
    function toggleVisibility() {
      const element = document.getElementById("toggleElement");
      element.style.display = element.style.display === "none" ? "block" : "none";
    }
  </script>
</body>
</html>
